apiVersion: v1
kind: Namespace
metadata:
  name: vault-lab
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-server
  namespace: vault-lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vault-auth-lab-tokenreview
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: vault-server
    namespace: vault-lab
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-lab-policy
  namespace: vault-lab
data:
  learning-go.hcl: |
    path "secret/data/learning-go/*" {
      capabilities = ["read"]
    }

    path "secret/metadata/learning-go/*" {
      capabilities = ["read", "list"]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault
  namespace: vault-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vault
  template:
    metadata:
      labels:
        app: vault
    spec:
      serviceAccountName: vault-server
      containers:
        - name: vault
          image: docker.io/hashicorp/vault:latest
          imagePullPolicy: IfNotPresent
          args:
            - server
            - -dev
            - -dev-root-token-id=root
            - -dev-listen-address=0.0.0.0:8200
          env:
            - name: VAULT_ADDR
              value: http://127.0.0.1:8200
          ports:
            - name: http
              containerPort: 8200
          readinessProbe:
            httpGet:
              path: /v1/sys/health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 2
          volumeMounts:
            - name: policy
              mountPath: /vault/lab
              readOnly: true
      volumes:
        - name: policy
          configMap:
            name: vault-lab-policy
---
apiVersion: v1
kind: Service
metadata:
  name: vault
  namespace: vault-lab
spec:
  selector:
    app: vault
  ports:
    - name: http
      port: 8200
      targetPort: http
