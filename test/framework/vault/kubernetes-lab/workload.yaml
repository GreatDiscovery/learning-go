apiVersion: v1
kind: ServiceAccount
metadata:
  name: learning-go
  namespace: vault-lab
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: intruder
  namespace: vault-lab
---
apiVersion: v1
kind: Pod
metadata:
  name: vault-client
  namespace: vault-lab
spec:
  serviceAccountName: learning-go
  automountServiceAccountToken: false
  containers:
    - name: client
      image: docker.io/hashicorp/vault:latest
      imagePullPolicy: IfNotPresent
      command:
        - sh
        - -ec
        - "trap : TERM INT; sleep 365d & wait"
      env:
        - name: VAULT_ADDR
          value: http://vault.vault-lab.svc:8200
      volumeMounts:
        - name: vault-token
          mountPath: /var/run/secrets/tokens
          readOnly: true
  volumes:
    - name: vault-token
      projected:
        sources:
          - serviceAccountToken:
              path: vault-token
              audience: vault
              expirationSeconds: 600
---
apiVersion: v1
kind: Pod
metadata:
  name: vault-intruder
  namespace: vault-lab
spec:
  serviceAccountName: intruder
  automountServiceAccountToken: false
  containers:
    - name: client
      image: docker.io/hashicorp/vault:latest
      imagePullPolicy: IfNotPresent
      command:
        - sh
        - -ec
        - "trap : TERM INT; sleep 365d & wait"
      env:
        - name: VAULT_ADDR
          value: http://vault.vault-lab.svc:8200
      volumeMounts:
        - name: vault-token
          mountPath: /var/run/secrets/tokens
          readOnly: true
  volumes:
    - name: vault-token
      projected:
        sources:
          - serviceAccountToken:
              path: vault-token
              audience: vault
              expirationSeconds: 600
